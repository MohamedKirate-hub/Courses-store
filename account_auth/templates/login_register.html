<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <form method="post">
            {% csrf_token %}
            <h1>
                {% if page == 'login' %}
                    Login
                {% else %}
                    Register
                {% endif %}
            </h1>
            {{ form.as_p }}
            <button type="submit">
                Submit
            </button>
            {% if page == 'login' %}
                <p>
                    Don't have an account?
                    <a href="{% url 'register' %}">Register</a>
                </p>
                {% else %}
                    <p>
                        Already have an account?
                        <a href="{% url 'login' %}">Login</a>
                    </p>
                {% endif %}
        </form>
    </div>
</body>
</html>
